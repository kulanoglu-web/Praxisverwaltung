version: 2.1
# ci-trigger: 2026-10-02-original-logo-setup

orbs:
  win: circleci/windows@5.0.0

jobs:
  windows-build-test:
    executor:
      name: win/server-2022
      size: medium

    steps:
      - checkout

      - run:
          name: Use preinstalled Python
          command: |
            python --version
            python -m pip --version

      - run:
          name: Dependencies and syntax
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m pip install pymupdf
            python -m py_compile main.py ui_screenshot_test.py generate_icon.py
            python generate_icon.py

      - run:
          name: UI smoke test (keine Laufzeit-Mutation)
          command: |
            python ui_screenshot_test.py

      - run:
          name: Build onedir bundle from spec
          command: |
            python -m PyInstaller --noconfirm --clean PraxisPro.spec
            if (!(Test-Path "dist\Praxisverwaltung\Praxisverwaltung.exe")) {
              throw "Praxisverwaltung.exe missing"
            }

      - run:
          name: Build installer
          command: |
            choco install innosetup --yes --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            & $iscc "/DMyAppVersion=0.12.18" "PraxisPro.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - run:
          name: Install and launch smoke test
          command: |
            $setup = Get-ChildItem "installer\PraxisPro_Setup_v*.exe" | Select-Object -First 1
            if (!$setup) { throw "Installer missing" }
            $target = Join-Path $env:TEMP "PraxisPro_CI"
            $installLog = Join-Path $env:TEMP "PraxisPro-install.log"
            $installArgs = @(
              "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART",
              ('/DIR="' + $target + '"'),
              ('/LOG="' + $installLog + '"')
            )
            $p = Start-Process -FilePath $setup.FullName -ArgumentList $installArgs -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              if (Test-Path $installLog) { Get-Content $installLog -Tail 200 }
              throw "Installation failed with exit code $($p.ExitCode)"
            }
            $exe = Join-Path $target "Praxisverwaltung.exe"
            if (!(Test-Path $exe)) { throw "Installed EXE missing" }
            $sourceLogo = "assets\\logo.png"
            if (!(Test-Path $sourceLogo)) { throw "Source assets/logo.png missing" }
            $expected = (Get-FileHash $sourceLogo -Algorithm SHA256).Hash.ToLower()
            Write-Host "Expected source logo hash: $expected"
            $installedLogo = Join-Path $target "_internal\\assets\\logo.png"
            if (!(Test-Path $installedLogo)) { throw "Installed _internal/assets/logo.png missing" }
            $installedHash = (Get-FileHash $installedLogo -Algorithm SHA256).Hash.ToLower()
            if ($installedHash -ne $expected) { throw "Installed logo hash mismatch: $installedHash" }
            Write-Host "Installed logo OK: $installedHash"
            $proc = Start-Process $exe -PassThru
            Start-Sleep -Seconds 12
            if ($proc.HasExited) { throw "PraxisPro exited during startup smoke test" }
            Stop-Process -Id $proc.Id -Force

      - store_artifacts:
          path: installer
          destination: PraxisPro-Installer
          when: always

      - store_artifacts:
          path: ui_test_output
          destination: UI-Test

workflows:
  praxispro-windows:
    jobs:
      - windows-build-test
