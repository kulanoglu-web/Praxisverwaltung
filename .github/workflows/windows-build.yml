name: Build PraxisPro Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "main.py"
      - "requirements.txt"
      - "PraxisPro.spec"\n      - "smoke_screenshot.py"
      - "build_windows.bat"
      - "build_setup.bat"
      - "installer/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture PraxisPro UI screenshot\n        shell: cmd\n        run: python smoke_screenshot.py\n\n      - name: Build PraxisPro EXE
        shell: cmd
        run: build_windows.bat

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: build_setup.bat

      - name: Verify outputs
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PraxisPro.exe")) { throw "PraxisPro.exe fehlt" }
          $setup = Get-ChildItem "setup/PraxisPro_Setup_v*.exe" | Select-Object -First 1
          if (!$setup) { throw "PraxisPro Setup fehlt" }
          Get-FileHash "dist/PraxisPro.exe" -Algorithm SHA256
          Get-FileHash $setup.FullName -Algorithm SHA256

      - name: Publish setup as GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.11.33"
          $setup = "setup/PraxisPro_Setup_v0.11.33.exe"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $setup --repo "${{ github.repository }}" --title "PraxisPro v0.11.33" --notes "Windows-Setup für PraxisPro v0.11.33."
          } else {
            gh release upload $tag $setup --repo "${{ github.repository }}" --clobber
          }
