name: Build PraxisPro Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "main.py"
      - "requirements.txt"
      - "PraxisPro.spec"
      - "build_windows.bat"
      - "build_setup.bat"
      - "installer/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build PraxisPro EXE
        shell: cmd
        run: build_windows.bat

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: build_setup.bat

      - name: Verify outputs
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PraxisPro.exe")) { throw "PraxisPro.exe fehlt" }
          $setup = Get-ChildItem "setup/PraxisPro_Setup_v*.exe" | Select-Object -First 1
          if (!$setup) { throw "PraxisPro Setup fehlt" }
          Get-FileHash "dist/PraxisPro.exe" -Algorithm SHA256
          Get-FileHash $setup.FullName -Algorithm SHA256

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PraxisPro-Windows-v0.11.33
          path: |
            dist/PraxisPro.exe
            setup/PraxisPro_Setup_v0.11.33.exe
          if-no-files-found: error
          retention-days: 30
