name: Windows EXE
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        shell: pwsh
        run: |
          $m = Select-String -Path main.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $m) { throw "APP_VERSION not found in main.py" }
          $v = $m.Matches[0].Groups[1].Value
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Building PraxisPro v$v"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - name: UI screenshot test (1600x900)
        run: python ui_screenshot_test.py
      - run: pyinstaller --noconfirm --clean --onefile --windowed --add-data "assets/logo.jpg;assets" --name Praxisverwaltung main.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Detect signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_B64)) { "HAS_SIGNING_CERT=false" >> $env:GITHUB_ENV } else { "HAS_SIGNING_CERT=true" >> $env:GITHUB_ENV }
      - name: Sign application executable
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        shell: pwsh
        env:
          SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "praxispro-signing.pfx"
          [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:SIGNING_PFX_B64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object FullName -Match 'x64' | Select-Object -Last 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGNING_PASSWORD dist\Praxisverwaltung.exe
          & $signtool verify /pa /v dist\Praxisverwaltung.exe
          Remove-Item $pfx -Force
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" PraxisPro.iss'
      - name: Sign installer
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        shell: pwsh
        env:
          SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "praxispro-signing.pfx"
          [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:SIGNING_PFX_B64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object FullName -Match 'x64' | Select-Object -Last 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGNING_PASSWORD "installer\PraxisPro_Setup_v$env:APP_VERSION.exe"
          & $signtool verify /pa /v "installer\PraxisPro_Setup_v$env:APP_VERSION.exe"
          Remove-Item $pfx -Force
      - name: Signing status
        shell: pwsh
        run: |
          if ("$env:HAS_SIGNING_CERT" -eq "true") { Write-Host "PraxisPro EXE and installer are Authenticode-signed and verified." } else { Write-Warning "No trusted code-signing certificate configured. Build is unsigned." }
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --title "PraxisPro v$env:APP_VERSION" --notes "PraxisPro Windows-Release."
          }
          gh release upload $tag test-artifacts/*.png dist/Praxisverwaltung.exe "installer/PraxisPro_Setup_v$env:APP_VERSION.exe" --repo "${{ github.repository }}" --clobber
      # Release assets are the canonical distributables. This avoids failing the
      # whole build when the temporary GitHub Actions artifact quota is exhausted.
