name: Windows EXE
permissions:
  contents: write
on:
  workflow_dispatch:
      inputs:
        rebuild:
          description: 'Manual rebuild marker'
          required: false
          default: 'v0.12.18'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        shell: pwsh
        run: |
          $m = Select-String -Path main.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $m) { throw "APP_VERSION not found in main.py" }
          $v = $m.Matches[0].Groups[1].Value
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Building PraxisPro v$v"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller pymupdf
      - name: Python syntax check
        run: python -m py_compile main.py ui_screenshot_test.py
      - name: UI screenshot test (1600x900)
        run: python ui_screenshot_test.py
      - name: Prepare application icon
        shell: pwsh
        run: |
          if (Test-Path "assets/PraxisPro.ico") {
            Write-Host "Using repository application icon."
          } else {
            Write-Host "No valid ICO supplied; build will continue without generated icon."
          }
      
      - name: Build Windows executable
        shell: pwsh
        run: |
          $args = @("--noconfirm","--clean","--onefile","--windowed","--collect-submodules","reportlab.graphics.barcode","--collect-submodules","reportlab.graphics","--add-data","assets/logo.png;assets")
          if (Test-Path "assets/paypal.png") {
            $args += @("--add-data","assets/paypal.png;assets")
            Write-Host "Bundling official PayPal logo asset."
          } else {
            Write-Host "PayPal logo asset not present; invoice uses text fallback."
          }
          $args += @("--name","Praxisverwaltung","main.py")
          pyinstaller @args
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Detect signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_B64)) { "HAS_SIGNING_CERT=false" >> $env:GITHUB_ENV } else { "HAS_SIGNING_CERT=true" >> $env:GITHUB_ENV }
      - name: Sign application executable
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        shell: pwsh
        env:
          SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "praxispro-signing.pfx"
          [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:SIGNING_PFX_B64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object FullName -Match 'x64' | Select-Object -Last 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGNING_PASSWORD dist\Praxisverwaltung.exe
          & $signtool verify /pa /v dist\Praxisverwaltung.exe
          Remove-Item $pfx -Force
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" PraxisPro.iss'
      - name: Installer smoke test after build
        shell: pwsh
        run: |
          $setup = "installer\\PraxisPro_Setup_v$env:APP_VERSION.exe"
          $target = Join-Path $env:RUNNER_TEMP "PraxisProSmoke"
          if (-not (Test-Path $setup)) { throw "Setup not found: $setup" }
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          $exe = Join-Path $target "Praxisverwaltung.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable missing: $exe" }
          Write-Host "Installer smoke test passed. Installed EXE: $exe"

          # Installierte Anwendung wirklich starten. Sie muss mehrere Sekunden
          # ohne unmittelbaren Crash laufen; anschließend wird sie kontrolliert beendet.
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "Installed PraxisPro exited/crashed during startup. ExitCode=$($app.ExitCode)" }
          Write-Host "Installed PraxisPro startup test passed (process alive after 10 seconds)."
          Stop-Process -Id $app.Id -Force
      - name: Sign installer
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        shell: pwsh
        env:
          SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "praxispro-signing.pfx"
          [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:SIGNING_PFX_B64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object FullName -Match 'x64' | Select-Object -Last 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGNING_PASSWORD "installer\PraxisPro_Setup_v$env:APP_VERSION.exe"
          & $signtool verify /pa /v "installer\PraxisPro_Setup_v$env:APP_VERSION.exe"
          Remove-Item $pfx -Force
      - name: Signing status
        shell: pwsh
        run: |
          if ("$env:HAS_SIGNING_CERT" -eq "true") { Write-Host "PraxisPro EXE and installer are Authenticode-signed and verified." } else { Write-Warning "No trusted code-signing certificate configured. Build is unsigned." }
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $repo = "${{ github.repository }}"
          gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title "PraxisPro v$env:APP_VERSION" --notes "PraxisPro Windows-Release."
            if ($LASTEXITCODE -ne 0) { throw "Release konnte nicht erstellt werden." }
          }

          $files = @()
          $files += Get-ChildItem "test-artifacts/*.png" | ForEach-Object { $_.FullName }
          $files += Get-ChildItem "test-artifacts/*.pdf" | ForEach-Object { $_.FullName }

          # Zusätzlich eine ZIP-Datei mit allen echten Windows-Testbildern bereitstellen.
          Compress-Archive -Path "test-artifacts/*.png" -DestinationPath "PraxisPro_UI_Screenshots_v$env:APP_VERSION.zip" -Force
          $files += (Resolve-Path "PraxisPro_UI_Screenshots_v$env:APP_VERSION.zip").Path
          $files += (Resolve-Path "dist/Praxisverwaltung.exe").Path
          $files += (Resolve-Path "installer/PraxisPro_Setup_v$env:APP_VERSION.exe").Path

          foreach ($file in $files) {
            $name = Split-Path $file -Leaf
            Write-Host "Uploading $name"
            gh release upload $tag "$file" --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release-Upload fehlgeschlagen: $name" }
          }

          $check = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          $uploaded = @($check.assets).name
          foreach ($file in $files) {
            $name = Split-Path $file -Leaf
            if ($uploaded -notcontains $name) { throw "Asset nach Upload nicht im Release gefunden: $name" }
          }
          Write-Host "Release verifiziert: $($uploaded.Count) Assets vorhanden."
          Write-Host ("Assets: " + ($uploaded -join ", "))
      # Release assets are the canonical distributables. This avoids failing the
      # whole build when the temporary GitHub Actions artifact quota is exhausted.
