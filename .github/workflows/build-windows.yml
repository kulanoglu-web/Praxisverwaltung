name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - name: UI screenshot test (1600x900)
        run: python ui_screenshot_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PraxisPro-UI-Screenshot
          path: test-artifacts/PraxisPro-Sitzung-1600x900.png
          retention-days: 30
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name Praxisverwaltung main.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" PraxisPro.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: PraxisPro-Windows-v0.10.6
          path: |
            dist/Praxisverwaltung.exe
            installer/PraxisPro_Setup_v0.10.6.exe
          retention-days: 30
