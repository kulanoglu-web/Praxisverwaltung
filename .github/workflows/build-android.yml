name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/build-android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p mobile assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Praxisverwaltung-Android
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
